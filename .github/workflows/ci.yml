
name: CI - Build and Publish Microservices

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: version
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Service
        id: api
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-service
          file: ./services/api-service/dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/api-service:${{ steps.version.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/api-service:latest

      - name: Build Auth Service
        id: auth
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          file: ./services/auth-service/dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/auth-service:${{ steps.version.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/auth-service:latest

      - name: Build Worker Service
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/worker-service
          file: ./services/worker-service/dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/worker-service:${{ steps.version.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/worker-service:latest

      - name: Build Summary
        if: always()
        run: |
          echo "## Microservices CI Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.version.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API Service: ${{ steps.api.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth Service: ${{ steps.auth.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker Service: ${{ steps.worker.outcome }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "- Publishing: Images pushed to GHCR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Publishing: Skipped (build verification only)" >> "$GITHUB_STEP_SUMMARY"
          fi
          
