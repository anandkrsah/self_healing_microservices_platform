services:
  api-service:
    build:
      context: ../services/api-service
    image: api-service:local
    ports:
      - "5000:5000"
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service 
    image: auth-service:local
    ports:
      - "5001:5001"
    restart: unless-stopped

  worker-service:
    build:
      context: ../services/worker-service
    image: worker-service:local
    ports:
     - "5002:5002"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - api-service
      - auth-service
      - worker-service
  grafana:
   image: grafana/grafana:10.3.3
   container_name: grafana
   restart: unless-stopped
   environment:
    GF_SECURITY_ADMIN_USER: admin
    GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD first}
    GF_USERS_ALLOW_SIGN_UP: "false"
   ports:
     - "3000:3000"
   volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

   depends_on:
    - prometheus

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - type: bind
        source: ./monitoring/loki-config.yml
        target: /etc/loki/local-config.yaml
        read_only: true
        bind:
          create_host_path: false

      - loki_data:/loki

    command:
      - "-config.file=/etc/loki/local-config.yaml"
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped

    environment:
      CONTAINERS: 1
      INFO: 1
      NETWORKS: 1
      POST: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - default

  alloy:
    image: grafana/alloy:v1.11.0
    container_name: alloy
    restart: unless-stopped

    ports:
      - "127.0.0.1:12345:12345"

    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

    depends_on:
      - docker-socket-proxy
      - loki

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
       - type: bind
         source: ./monitoring/alertmanager.yml
         target: /etc/alertmanager/alertmanager.yml
         read_only: true
         bind:
           create_host_path: false
volumes:
  grafana_data:
  loki_data:
     