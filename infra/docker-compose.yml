services:
  api-service:
    build:
      context: ../services/api-service
    image: api-service:local
    ports:
      - "5000:5000"
    restart: unless-stopped

  auth-service:
    build:
      context: ../services/auth-service 
    image: auth-service:local
    ports:
      - "5001:5001"
    restart: unless-stopped

  worker-service:
    build:
      context: ../services/worker-service
    image: worker-service:local
    ports:
     - "5002:5002"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - api-service
      - auth-service
      - worker-service

  grafana:
   image: grafana/grafana:10.3.3
   container_name: grafana
   restart: unless-stopped
   environment:
    GF_SECURITY_ADMIN_USER: admin
    GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD first}
    GF_USERS_ALLOW_SIGN_UP: "false"
   ports:
     - "3000:3000"
   volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

   depends_on:
    - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
       - type: bind
         source: ./monitoring/alertmanager.yml
         target: /etc/alertmanager/alertmanager.yml
         read_only: true
         bind:
           create_host_path: false
volumes:
  grafana_data:
     