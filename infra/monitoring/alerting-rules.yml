groups:
  - name: microservices-alerts
    rules:
      - alert: MicroserviceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A microservice is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."

      - alert: WorkerJobFailures
        expr: sum(rate(worker_jobs_total{status="failed"}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker job failure rate is high"
          description: "The worker is experiencing an elevated job failure rate."