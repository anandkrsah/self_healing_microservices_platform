global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-service:5000"]

  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:5001"]

  - job_name: "worker-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-service:5002"]
